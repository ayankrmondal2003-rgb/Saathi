# Zero-cost layout (see DEPLOYMENT.md): Render Free runs only the API. The database is Neon Free, files are in a
# private Cloudflare R2 bucket, and Redis is not used (single worker, in-memory realtime bus).
services:
  - type: web
    name: surakshanet-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    # Cheap and process-local: never opens a database connection, so it does not wake Neon.
    healthCheckPath: /ready
    dockerCommand: sh /app/start-render.sh
    envVars:
      # Neon connection string (direct, non-pooler endpoint), pasted in the dashboard. Never committed,
      # and not linked to a Render database.
      - key: DATABASE_URL
        sync: false
      # Private file storage (Cloudflare R2, S3 API). Leave unset to keep uploads disabled.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # REDIS_URL is intentionally absent: optional, only needed when running more than one worker.
      # beta: open access for any verified account, real SOS (SOS_PER_HOUR, default 3). The master branch before
      # the beta merge only accepts development/test/production, so set this back before deploying older code.
      - key: ENVIRONMENT
        value: beta
      - key: FIREBASE_PROJECT_ID
        value: surakshanet-c4ec1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      # Ignored in beta (open access); used again in development/test.
      - key: TEST_ACCOUNT_UIDS
        sync: false
      # Signs live-location links (/l/<token>) so they survive restarts. Any long random string.
      - key: LIVE_LINK_SECRET
        sync: false
      # Base URL used in live-location links, e.g. https://<service>.onrender.com (no trailing slash).
      - key: PUBLIC_URL
        sync: false
      # AES-GCM key for medical notes: 32 random bytes, base64. Losing or changing it makes saved notes unreadable.
      - key: MEDICAL_NOTES_KEY
        sync: false
      # Sentry DSN for server error reports (errors only, scrubbed). Unset means no reporting.
      - key: SENTRY_DSN
        sync: false
      # Firebase web app apiKey for the /admin volunteer review sign-in page.
      - key: FIREBASE_WEB_API_KEY
        sync: false
