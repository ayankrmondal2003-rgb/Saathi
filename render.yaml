services:
  - type: web
    name: surakshanet-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    dockerCommand: sh /app/start-render.sh
    envVars:
      - key: DATABASE_URL
        # Owner supplies the existing database's internal connection URL privately.
        sync: false
      - key: REDIS_URL
        fromService:
          name: surakshanet-kv
          type: keyvalue
          property: connectionString
      # Synthetic fixes are supported. The API and outbox enforce the test UID allowlist.
      - key: ENVIRONMENT
        value: development
      - key: FIREBASE_PROJECT_ID
        value: surakshanet-c4ec1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-admin.json
      - key: TEST_ACCOUNT_UIDS
        sync: false
  - type: keyvalue
    name: surakshanet-kv
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
